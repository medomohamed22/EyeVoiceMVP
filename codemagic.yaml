workflows:
  android-debug:
    name: Eye Voice MVP 0.2 Android Debug
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Download Gradle 9.5
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
      - name: Download MediaPipe Face Landmarker model
        script: |
          mkdir -p "$CM_BUILD_DIR/app/src/main/assets"
          curl -L \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task \
            -o "$CM_BUILD_DIR/app/src/main/assets/face_landmarker.task"
          test -s "$CM_BUILD_DIR/app/src/main/assets/face_landmarker.task"
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          /tmp/gradle/gradle-9.5/bin/gradle assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
